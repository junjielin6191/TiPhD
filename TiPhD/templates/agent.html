{% extends 'base.html' %}

{% block title %}TiAgent - Research Assistant{% endblock %}

{% block content %}
<div class="agent-layout">
    <div class="agent-sidebar">
        <button id="new-chat-btn" class="new-chat-btn">
            <i class="fas fa-plus"></i> New Chat
        </button>
        <div class="session-list-container">
            <ul id="session-list" class="session-list">
                </ul>
        </div>
    </div>

    <div class="agent-main">
        <div class="chat-header">
            <h3 id="current-chat-title">New Conversation</h3>
        </div>
        
        <div class="chat-box" id="chat-box">
            <div class="welcome-screen" id="welcome-screen">
                <h2>Welcome to TiAgent</h2>
                <p>Your intelligent biomedical research assistant.</p>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <textarea id="chat-input" placeholder="Ask about tumor microenvironment, spatial localization, or tools..." rows="1"></textarea>
                <button id="send-btn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="{{ url_for('static', filename='css/agent.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="{{ url_for('static', filename='js/agent.js') }}"></script>
{% endblock %}
